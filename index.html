<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Log Voice Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
    }

    #voiceButton {
      background: #4285F4;
      color: white;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎤 Task Log Assistant</h1>

  <p>
    Click the button and speak your task.
  </p>

  <button id="voiceButton">
    🎤 Speak Command
  </button>

  <textarea
    id="command"
    placeholder="Example: Assign Suruchi ma'am the task of screening resumes, estimated 3 hours, priority P1">
  </textarea>

  <div id="status"></div>

</div>


<script>

const voiceButton =
  document.getElementById("voiceButton");

const commandBox =
  document.getElementById("command");

const statusBox =
  document.getElementById("status");


voiceButton.addEventListener("click", function() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusBox.innerText =
      "❌ Speech recognition is not supported. Please use Google Chrome.";

    return;
  }


  const recognition =
    new SpeechRecognition();


  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart = function() {

    statusBox.innerText =
      "🎤 Listening...";

    voiceButton.innerText =
      "🎙️ Listening...";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    commandBox.value =
      text;

    statusBox.innerText =
      "✅ Command captured.";

    voiceButton.innerText =
      "🎤 Speak Command";

  };


  recognition.onerror = function(event) {

    statusBox.innerText =
      "❌ Voice error: " + event.error;

    voiceButton.innerText =
      "🎤 Speak Command";

    console.log(event);

  };


  recognition.onend = function() {

    voiceButton.innerText =
      "🎤 Speak Command";

  };


  recognition.start();

});

</script>

</body>
</html>
