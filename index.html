<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Task Log Voice Assistant</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      width: 100%;
    }

    #voiceButton {
      background: #4285F4;
      color: white;
    }

    #addButton {
      background: #34A853;
      color: white;
    }

    #addButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .preview {
      margin-top: 20px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 8px;
    }

    .row {
      margin: 8px 0;
    }

    .label {
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🎤 Task Log Assistant</h1>

  <p>
    Speak your task command.
  </p>


  <button id="voiceButton">
    🎤 Speak Command
  </button>


  <textarea
    id="command"
    placeholder="Example: Assign Suruchi ma'am the task of screening resumes, estimated 3 hours, priority P1">
  </textarea>


  <div class="preview">

    <div class="row">
      <span class="label">Employee:</span>
      <span id="employee">-</span>
    </div>

    <div class="row">
      <span class="label">Task:</span>
      <span id="task">-</span>
    </div>

    <div class="row">
      <span class="label">Priority:</span>
      <span id="priority">-</span>
    </div>

    <div class="row">
      <span class="label">Estimated Hours:</span>
      <span id="hours">-</span>
    </div>

  </div>


  <button id="addButton" disabled>
    ✓ Add Task
  </button>


  <div id="status"></div>

</div>


<script>


// =====================================================
// YOUR APPS SCRIPT WEB APP URL
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxveIsr1F6chLrQHpgNfYkbX6cRAWiyalITr45rERCF1bm4UZXuinI3jdV-PK7H30TM/exec";


// =====================================================
// ELEMENTS
// =====================================================

const voiceButton =
  document.getElementById("voiceButton");

const addButton =
  document.getElementById("addButton");

const commandBox =
  document.getElementById("command");

const statusBox =
  document.getElementById("status");


// =====================================================
// VOICE RECOGNITION
// =====================================================

voiceButton.addEventListener("click", function() {


  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    statusBox.innerText =
      "❌ Speech recognition is not supported. Use Google Chrome.";

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart = function() {

    statusBox.innerText =
      "🎤 Listening...";

    voiceButton.innerText =
      "🎙️ Listening...";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;


    commandBox.value =
      text;


    parseCommand(text);


    statusBox.innerText =
      "✅ Command captured.";

  };


  recognition.onerror = function(event) {

    statusBox.innerText =
      "❌ Voice error: " + event.error;

  };


  recognition.onend = function() {

    voiceButton.innerText =
      "🎤 Speak Command";

  };


  recognition.start();

});


// =====================================================
// PARSE COMMAND
// =====================================================

function parseCommand(text) {


  let employee = "";

  let task = text;

  let priority = "";

  let hours = "";


  // Employee

 let employeeMatch =
  text.match(
    /(?:assign|science)\s+(.+?)\s+(?:the\s+)?task/i
  );

  if (employeeMatch) {

    employee =
      employeeMatch[1].trim();

  }


  // Hours

  let hoursMatch =
    text.match(
      /(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)/i
    );


  if (hoursMatch) {

    hours =
      hoursMatch[1];

  }


  // Priority

  let priorityMatch =
    text.match(
      /\b(P[1-4])\b/i
    );


  if (priorityMatch) {

    priority =
      priorityMatch[1].toUpperCase();

  }


  // Task

  if (employeeMatch) {

    task =
      text.substring(
        employeeMatch[0].length
      );

  }


  task =
    task
      .replace(
        /estimated\s*(?:time)?\s*\d+(?:\.\d+)?\s*(?:hours?|hrs?)/i,
        ""
      )
      .replace(
        /\bpriority\s*P[1-4]\b/i,
        ""
      )
     .replace(
  /^(?:of|to)\s+/i,
  ""
)
      .replace(
        /[,.\s]+$/,
        ""
      )
      .trim();


  document.getElementById("employee").innerText =
    employee || "-";


  document.getElementById("task").innerText =
    task || "-";


  document.getElementById("priority").innerText =
    priority || "-";


  document.getElementById("hours").innerText =
    hours || "-";


  if (text.trim()) {

    addButton.disabled = false;

  }

}


// =====================================================
// SEND TASK TO APPS SCRIPT
// =====================================================

addButton.addEventListener("click", async function() {


  const command =
    commandBox.value.trim();


  if (!command) {

    return;

  }


  const taskData = {


    employeeName:
      document.getElementById("employee").innerText,


    task:
      document.getElementById("task").innerText,


    category:
      "",


    priority:
      document.getElementById("priority").innerText,


    estimatedNumbers:
      "",


    estimatedHours:
      document.getElementById("hours").innerText,


    status:
      "Pending",


    dueDate:
      ""

  };


  statusBox.innerText =
    "⏳ Adding task...";


  addButton.disabled = true;


  try {


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(taskData)

        }
      );


    const result =
      await response.json();


    if (result.success) {


      statusBox.innerText =
        "✅ Task added successfully!";


      commandBox.value = "";


      document.getElementById("employee").innerText =
        "-";


      document.getElementById("task").innerText =
        "-";


      document.getElementById("priority").innerText =
        "-";


      document.getElementById("hours").innerText =
        "-";


    } else {


      statusBox.innerText =
        "❌ " + result.error;

      addButton.disabled = false;

    }


  } catch (error) {


    statusBox.innerText =
      "❌ Connection error: " +
      error.message;


    addButton.disabled = false;

  }

});


</script>

</body>

</html>
